name: onnx_inference_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  permission_handler: ^12.0.1
  record: ^6.2.0
  path_provider: ^2.1.5
  flutter_onnxruntime: ^1.7.0
  yaml: ^3.1.3

dependency_overrides:
  flutter_onnxruntime:
    path: packages/flutter_onnxruntime

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/espnet_onnx/bpe.model
    - assets/models/espnet_onnx/config.yaml
    - assets/models/espnet_onnx/default_encoder.onnx
    - assets/models/espnet_onnx/xformer_decoder.onnx
    - assets/models/espnet_onnx/ctc.onnx